# .github/workflows/ci.yml
# Runs on every PR and every push to main. Gates merging.
# Does NOT release — that's release.yml.
# Notes:   the Trivy job fails the build on main AND on any PR touching package.json /
#          package-lock.json; it stays advisory elsewhere so an unfixable upstream CVE
#          can't block unrelated work. See the comment on that job before loosening it.
#          `db-tests` boots a real Supabase stack and runs BOTH the *.dbtest.ts tier (which
#          `npm run check` cannot see) and the DB security categories. Added 2026-08-17 —
#          before it, the tier ran on one laptop and in no workflow, and the security
#          categories ran nowhere at all while reporting green. The old `security-scan` job
#          was removed rather than fixed; see the comment where it used to be.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quick-check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Typecheck + Lint (npm run check)
        run: npm run check

  # NOTE: No `build` job in CI.
  # Vercel handles production and preview builds directly. Running `next build`
  # in CI would duplicate Vercel's work and require embedding real Supabase
  # credentials (several pages prerender with live data). The Vercel preview
  # deploy that fires on every PR is the authoritative build signal.

  marketing-consistency:
    name: Marketing consistency (ADDENDUM_00J)
    needs: quick-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Check marketing consistency
        run: node scripts/check-marketing-consistency.mjs

  # ── `security-scan` WAS HERE, AND ITS REMOVAL IS THE FIX, NOT A LOSS OF COVERAGE ──────────────
  #
  # It ran `npm run security:db` with SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY drawn from
  # secrets.CI_SUPABASE_URL / secrets.CI_SUPABASE_SERVICE_ROLE_KEY. Neither secret has ever existed on
  # this repo — `gh secret list` returns only SENTRY_AUTH_TOKEN — and GitHub substitutes an empty
  # string for an undefined secret rather than failing. So the job ran, found nothing to connect to,
  # short-circuited, and reported success in ~45 seconds for the entire life of the repo. Categories
  # 1, 2, 5 and 7 never executed once. `continue-on-error: false` made it look strict.
  #
  # Those categories now run in the `db-tests` job below, against the Supabase stack it already boots
  # (NOW.md item 14d). That is strictly better than provisioning a hosted CI project:
  #   · no long-lived service-role key in GitHub secrets — a service key bypasses RLS entirely, so
  #     storing one hands every workflow run and every transitive build dependency a path to customer
  #     data. The exposure does not get mitigated; it ceases to exist.
  #   · no drift — the stack is rebuilt from the migration files on every run, so the schema audited
  #     is the schema under test. A hosted project needs someone to re-apply migrations forever.
  #   · a hosted project would have FAILED Category 7 anyway until item 14e, because get_rls_audit()
  #     lived in no migration.
  #
  # Do not reinstate a credential-fed security job without reading OUTSTANDING.md first.

  # The DB-integration tier (31 *.dbtest.ts files, 164 tests) hits a REAL Postgres through PostgREST.
  # Until 2026-08-17 it ran on ONE developer laptop and in no workflow at all: `npm run check` — the
  # gate PRs actually run — excludes it, and `check:full` (which includes it) is a local, honour-system
  # pre-push step. That gap already cost a bad merge: the 21C crash-convergence regression (#245) had a
  # dbtest covering it, and nothing was obliged to run it.
  #
  # Why the full CLI stack rather than a bare Postgres service container: the migrations are deeply
  # coupled to Supabase's own schemas — `auth.users` FKs, 25+ `auth.uid()` RLS policies, the
  # anon/authenticated/service_role roles, and `storage.buckets`/`storage.objects` writes across six
  # migration files. Replaying 001–012 on stock Postgres would mean hand-building auth and storage
  # shims and a standalone PostgREST. `supabase start` already IS the topology test/db/setup.ts
  # assumes (127.0.0.1:54321), so CI just becomes that topology instead of a laptop.
  db-tests:
    name: DB integration tier (test:db)
    needs: quick-check
    runs-on: ubuntu-latest
    # Generous: first run pulls the whole stack's images. Tighten once a few runs have been timed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # v3 is the current major (latest release v3.0.0, checked 2026-08-17). `v1` is NOT a tag on that
      # repo — only v2.x and v3.x exist — so the commonly-copied `@v1` would have failed to resolve.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # Applies supabase/migrations 001–012 in order as part of boot. test/db/global-setup.ts then
      # grants service_role on the public schema, and tier.ts finds the container by the
      # `supabase_db` name prefix — which matches the CLI's `supabase_db_pleks` (project_id in
      # supabase/config.toml) exactly as it matches a laptop's stack.
      # ⚠ EXCLUDE THE SERVICES THE TIER DOES NOT USE. A full `supabase start` boots the mail UI, the
      # studio, imgproxy, the edge runtime, analytics and the pooler — none of which any *.dbtest.ts
      # touches. On 2026-08-18 that cost a red CI run for a reason unrelated to any code in the PR:
      #
      #   failed to bind host port 0.0.0.0:54324 … address already in use   (supabase_inbucket_pleks)
      #
      # All twelve migrations had applied cleanly; the mail container simply could not get its port on
      # that runner. Booting fewer containers removes a whole class of flake AND cuts the job's slowest
      # phase — image pulls — rather than trading correctness for speed.
      #
      # KEPT deliberately: postgrest + kong (the tests talk REST through 54321), gotrue (the auth
      # schema the migrations FK against) and storage-api (its own migrations create storage.buckets,
      # which six migration files write to). Do not prune those to go faster.
      #
      # ⚠ Do NOT add --ignore-health-check to quiet a failure here. A stack that came up unhealthy is
      # a result, not noise.
      - name: Start the local Supabase stack
        run: supabase start -x mailpit,studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime

      - name: Run the DB integration tier
        run: npm run test:db

      # NOW.md item 14d. These categories used to live in a separate `security-scan` job pointed at
      # CI_SUPABASE_* secrets that were never set, so it went green in ~45s having scanned nothing.
      # They run here instead, against the stack this job already booted — no long-lived service-role
      # key in GitHub secrets, and the schema audited is exactly the migrations under test rather than
      # a hosted project someone has to remember to re-migrate.
      #
      # Category 7 (RLS policy audit) is the load-bearing one and it is purely schema-level, so it
      # transfers here intact. It needs get_rls_audit(), which is now versioned in 009 (item 14e) —
      # before that it existed only in production, applied by hand, and would have 404'd here.
      #
      # ⚠ STATED COVERAGE LIMIT: cats 1, 2 and 5 are BEHAVIOURAL, and a freshly-migrated database has
      # no rows. An anon SELECT returning nothing proves less here than in production, so those three
      # partly pass for the wrong reason. Cat 1's DELETE check reads policies and is real. Closing the
      # rest means seeding fixtures into this stack, not reaching for a hosted project — a real
      # credential is a worse price than a coverage gap that fixtures can close.
      - name: Security DB categories against the CI stack
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
            npm run security:db

      - name: Stop the stack
        if: always()
        run: supabase stop

  dependency-scan:
    name: Dependency CVE scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need the base commit to diff against

      # WHY THIS STEP EXISTS. The gate used to be strict on main and advisory on every
      # PR. That let 16 HIGH CVEs (#226, 2026-08-10) pass their own PR as a green tick
      # and only surface on the next merge to main — which was a month later, and which
      # also held up Release, since Release depends on CI. Trivy had FOUND them and
      # reported a pass.
      #
      # A CVE can only enter through a dependency manifest, so a PR that touches one is
      # now gated exactly as strictly as main. Every other PR stays advisory, so an
      # upstream disclosure with no fix available still cannot block unrelated work.
      - name: Decide gate strictness
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            reason="push to main"; code=1
          elif [ -z "$BASE_SHA" ]; then
            reason="no PR base to diff (unexpected) — failing open, main still gates"; code=0
          elif git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(package\.json|package-lock\.json)$'; then
            reason="dependency manifest changed"; code=1
          else
            reason="no dependency manifest change"; code=0
          fi
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          echo "Trivy gate: $([ "$code" = 1 ] && echo STRICT || echo advisory) — $reason"

      - name: Run Trivy (strict on main and on any dependency change)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: ${{ steps.gate.outputs.exit-code }}
          ignore-unfixed: true

  fitscore-parity:
    name: FitScore primitive parity (§11.20)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check FitScore primitive parity
        run: node scripts/check-fitscore-parity.mjs
        env:
          PARITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # M-084. Release failed on three consecutive merges over two days and nobody noticed, because its
  # result went nowhere — two sessions read `gh run list` output with `failure` on the Release row and
  # acted on the CI row. A CI job whose result nobody consumes is not a control; this makes the next
  # PR the thing that consumes it. PR-only on purpose: on a main push it would report what the very
  # next Release run is about to re-decide.
  release-health:
    name: Release health (M-084)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read           # `gh run list` reads the Actions API; the top-level grant is contents-only
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # the deadlock carve-out diffs against origin/<base>

      - name: Check the last Release run on main
        run: node scripts/check-release-health.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            chore
            docs
            test
            build
            ci
            style
            revert
          requireScope: false
          # No subjectPattern — Dependabot uses "Bump X from Y to Z" (capital B, not configurable)
          validateSingleCommit: false
