# .github/workflows/ci.yml
# Runs on every PR and every push to main. Gates merging.
# Does NOT release — that's release.yml.
# Notes:   the Trivy job fails the build on main AND on any PR touching package.json /
#          package-lock.json; it stays advisory elsewhere so an unfixable upstream CVE
#          can't block unrelated work. See the comment on that job before loosening it.
#          `db-tests` boots a real Supabase stack and runs the *.dbtest.ts tier, which
#          `npm run check` cannot see. Added 2026-08-17 — before it, that tier ran on one
#          laptop and in no workflow.
#          ⚠ `security-scan` reads CI_SUPABASE_* secrets that are NOT set on this repo, so
#          it short-circuits and reports green in ~45s without scanning. See OUTSTANDING.md.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quick-check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Typecheck + Lint (npm run check)
        run: npm run check

  # NOTE: No `build` job in CI.
  # Vercel handles production and preview builds directly. Running `next build`
  # in CI would duplicate Vercel's work and require embedding real Supabase
  # credentials (several pages prerender with live data). The Vercel preview
  # deploy that fires on every PR is the authoritative build signal.

  marketing-consistency:
    name: Marketing consistency (ADDENDUM_00J)
    needs: quick-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Check marketing consistency
        run: node scripts/check-marketing-consistency.mjs

  security-scan:
    name: Security (static Supabase checks)
    needs: quick-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run security:db (static Supabase-only subset)
        run: npm run security:db
        env:
          SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY }}
        # ⚠ THESE SECRETS DO NOT EXIST ON THIS REPO — `gh secret list` returns only SENTRY_AUTH_TOKEN.
        # GitHub substitutes an empty string for an undefined secret, so this job ran and went GREEN in
        # ~45s while categories 1, 2, 5 and 7 — including the Category 7 RLS policy audit, the automated
        # proof that the tenant boundary holds — never executed. It had done so since the job was written.
        #
        # `audit.mjs --ci` now raises a CRITICAL and exits 1 when credentials are absent (NOW.md item
        # 14a), so THIS JOB IS EXPECTED TO FAIL until a dedicated CI Supabase project is provisioned and
        # these two secrets are set (item 14b, SB — go-live blocker). That failure is the point: it is
        # the probe-fire that makes a later pass mean something. Do NOT silence it with
        # `continue-on-error: true` — that recreates the exact advisory-gate bug closed in #234.
        # The full localhost audit (security:prod) remains a pre-deploy local step.
        continue-on-error: false

  # The DB-integration tier (31 *.dbtest.ts files, 164 tests) hits a REAL Postgres through PostgREST.
  # Until 2026-08-17 it ran on ONE developer laptop and in no workflow at all: `npm run check` — the
  # gate PRs actually run — excludes it, and `check:full` (which includes it) is a local, honour-system
  # pre-push step. That gap already cost a bad merge: the 21C crash-convergence regression (#245) had a
  # dbtest covering it, and nothing was obliged to run it.
  #
  # Why the full CLI stack rather than a bare Postgres service container: the migrations are deeply
  # coupled to Supabase's own schemas — `auth.users` FKs, 25+ `auth.uid()` RLS policies, the
  # anon/authenticated/service_role roles, and `storage.buckets`/`storage.objects` writes across six
  # migration files. Replaying 001–012 on stock Postgres would mean hand-building auth and storage
  # shims and a standalone PostgREST. `supabase start` already IS the topology test/db/setup.ts
  # assumes (127.0.0.1:54321), so CI just becomes that topology instead of a laptop.
  db-tests:
    name: DB integration tier (test:db)
    needs: quick-check
    runs-on: ubuntu-latest
    # Generous: first run pulls the whole stack's images. Tighten once a few runs have been timed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # v3 is the current major (latest release v3.0.0, checked 2026-08-17). `v1` is NOT a tag on that
      # repo — only v2.x and v3.x exist — so the commonly-copied `@v1` would have failed to resolve.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # Applies supabase/migrations 001–012 in order as part of boot. test/db/global-setup.ts then
      # grants service_role on the public schema, and tier.ts finds the container by the
      # `supabase_db` name prefix — which matches the CLI's `supabase_db_pleks` (project_id in
      # supabase/config.toml) exactly as it matches a laptop's stack.
      - name: Start the local Supabase stack
        run: supabase start

      - name: Run the DB integration tier
        run: npm run test:db

      - name: Stop the stack
        if: always()
        run: supabase stop

  dependency-scan:
    name: Dependency CVE scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need the base commit to diff against

      # WHY THIS STEP EXISTS. The gate used to be strict on main and advisory on every
      # PR. That let 16 HIGH CVEs (#226, 2026-08-10) pass their own PR as a green tick
      # and only surface on the next merge to main — which was a month later, and which
      # also held up Release, since Release depends on CI. Trivy had FOUND them and
      # reported a pass.
      #
      # A CVE can only enter through a dependency manifest, so a PR that touches one is
      # now gated exactly as strictly as main. Every other PR stays advisory, so an
      # upstream disclosure with no fix available still cannot block unrelated work.
      - name: Decide gate strictness
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            reason="push to main"; code=1
          elif [ -z "$BASE_SHA" ]; then
            reason="no PR base to diff (unexpected) — failing open, main still gates"; code=0
          elif git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(package\.json|package-lock\.json)$'; then
            reason="dependency manifest changed"; code=1
          else
            reason="no dependency manifest change"; code=0
          fi
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          echo "Trivy gate: $([ "$code" = 1 ] && echo STRICT || echo advisory) — $reason"

      - name: Run Trivy (strict on main and on any dependency change)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: ${{ steps.gate.outputs.exit-code }}
          ignore-unfixed: true

  fitscore-parity:
    name: FitScore primitive parity (§11.20)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check FitScore primitive parity
        run: node scripts/check-fitscore-parity.mjs
        env:
          PARITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            chore
            docs
            test
            build
            ci
            style
            revert
          requireScope: false
          # No subjectPattern — Dependabot uses "Bump X from Y to Z" (capital B, not configurable)
          validateSingleCommit: false
